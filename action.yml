name: Review App Operator Action

author: wille
branding:
  icon: anchor
  color: blue

description: Deploy review apps to Kubernetes using Github Actions and Review App Operator
inputs:
  review_app_name:
    description: The name of the Kubernetes Review App
    required: true
  review_app_namespace:
    description: The namespace of the Kubernetes Review App
    required: false
    default: default
  webhook_url:
    description: The target webhook URL
    required: true
  webhook_secret:
    description: The webhook secret
    required: true
  image:
    description: The new Docker Image to deploy
    required: false

outputs:
  review_app_url:
    description: The URL of the review app
    value: ${{ steps.webhook.outputs.review_app_url }}

# Runs the script directly on the runner, which needs bash, curl, jq and openssl
runs:
  using: composite
  steps:
    - id: webhook
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action-entrypoint.sh"
      env:
        INPUT_REVIEW_APP_NAME: ${{ inputs.review_app_name }}
        INPUT_REVIEW_APP_NAMESPACE: ${{ inputs.review_app_namespace }}
        INPUT_WEBHOOK_URL: ${{ inputs.webhook_url }}
        INPUT_WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
        INPUT_IMAGE: ${{ inputs.image }}
