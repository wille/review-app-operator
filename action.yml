name: Review App Operator Action

author: wille
branding:
  icon: anchor
  color: blue

description: Deploy review apps to Kubernetes using Github Actions and Review App Operator
inputs:
  review_app_name:
    description: The name of the Kubernetes Review App
    required: true
  review_app_namespace:
    description: The namespace of the Kubernetes Review App
    required: false
    default: default
  webhook_url:
    description: The target webhook URL
    required: true
  webhook_secret:
    description: "The webhook secret. Without it, the action deploys with the GitHub Actions ID token of the workflow, which needs the `id-token: write` permission and the repository in the `repositories` of the ReviewAppConfig"
    required: false
  oidc_audience:
    description: The audience to request the GitHub Actions ID token for, which is the `webhook.oidc.audience` of the chart
    required: false
    default: review-app-operator
  image:
    description: The new Docker Image to deploy
    required: false
  check:
    description: Whether to add a check with the URLs of the review app to the pull request
    required: false
    default: "true"
  github_token:
    description: "The token to add the check with, which needs the `checks: write` permission"
    required: false
    default: ${{ github.token }}

outputs:
  review_app_url:
    description: The URL of the review app
    value: ${{ steps.webhook.outputs.review_app_url }}
  review_app_urls:
    description: The URLs of every deployment of the review app, as a JSON object of the deployment names to their URLs
    value: ${{ steps.webhook.outputs.review_app_urls }}

# Runs the script directly on the runner, which needs bash, curl, jq and openssl
runs:
  using: composite
  steps:
    - id: webhook
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/action-entrypoint.sh"
      env:
        INPUT_REVIEW_APP_NAME: ${{ inputs.review_app_name }}
        INPUT_REVIEW_APP_NAMESPACE: ${{ inputs.review_app_namespace }}
        INPUT_WEBHOOK_URL: ${{ inputs.webhook_url }}
        INPUT_WEBHOOK_SECRET: ${{ inputs.webhook_secret }}
        INPUT_OIDC_AUDIENCE: ${{ inputs.oidc_audience }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
