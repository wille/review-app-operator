name: Release

on:
  release:
    types: [published]
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  docker:
    name: Push Docker image
    # Controller releases are tagged vX.Y.Z, the chart is released by chart.yml
    if: github.event_name == 'push' || startsWith(github.event.release.tag_name, 'v')
    permissions:
      contents: read # fetch the repository content
      packages: write # push to ghcr.io
      id-token: write # sign SLSA provenance and cache entries via GitHub OIDC
    # Builds each platform natively on its own runner, without QEMU, and merges them
    # into one image tagged like docker/metadata-action: master, or vX.Y.Z and latest
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1.18.1
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      meta-images: ghcr.io/wille/review-app-operator
      set-meta-labels: true
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # github-builder signs only the buildx attestation manifests, under the identity of
  # its own workflow, which every repository that uses it shares. Admission controllers
  # like sigstore policy-controller can't reach those from the index digest that a pod's
  # image resolves to. So sign the index here, keyless: the certificate identity is this
  # workflow's ref, https://github.com/wille/review-app-operator/.github/workflows/release.yml@<ref>,
  # refs/tags/vX.Y.Z for a release and refs/heads/master for master.
  sign:
    name: Sign Docker image
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      id-token: write # keyless signing with the GitHub OIDC token
      packages: write # push the signature and attestations to ghcr.io
    env:
      IMAGE: ghcr.io/wille/review-app-operator
      DIGEST: ${{ needs.docker.outputs.digest }}
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Attach BuildKit's SLSA provenance to the index as cosign attestations, one per
      # platform, which policy-controller can find
      - name: Attest SLSA provenance
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{ json .Provenance }}' > provenance.json
          jq -r 'to_entries[] | select(.value.SLSA) | .key' provenance.json > platforms.txt
          if [ ! -s platforms.txt ]; then
            echo "::error::No SLSA provenance on $IMAGE@$DIGEST"
            exit 1
          fi
          while read -r platform; do
            echo "Attesting the SLSA provenance of $platform"
            jq -e --arg p "$platform" '.[$p].SLSA' provenance.json > slsa.json
            cosign attest --yes --type slsaprovenance1 --predicate slsa.json "$IMAGE@$DIGEST"
          done < platforms.txt

      # The same check as the README's, so a signature that wouldn't verify fails the release
      - name: Verify signature
        run: |
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            > /dev/null
          cosign verify-attestation "$IMAGE@$DIGEST" --type slsaprovenance1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            > /dev/null
