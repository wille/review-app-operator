# Weekly dependency updates, grouped so that each week brings a few pull requests to review
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Leave new releases a week to be found broken or compromised before updating to them
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    groups:
      # The Kubernetes libraries and controller-runtime are released for each other
      kubernetes:
        patterns:
          - k8s.io/*
          - sigs.k8s.io/*
      go:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: docker
