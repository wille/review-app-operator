# The time to wait before stopping connection attempts to upstream review app
# The user will be prompted to refresh the page to try again and given the deployment status
connectionTimeout: 10s

# The active namespaces
namespaces:
  - review-apps

image: ghcr.io/wille/review-app-operator
tag: ""

webhook:
  # More than one replica keeps deploys working while a node is drained
  replicas: 2

  # How long a stopping webhook waits for deploys that stream their progress to finish
  terminationGracePeriodSeconds: 300

  # The webhook secret that will be used by the CI to trigger pull request events
  secretKeyRef:
    name: webhook-secret
    key: webhook-secret

  # Create the webhook secret with a random value if it does not exist.
  # Disable it to create the secret yourself when the chart is rendered with `helm template`,
  # like by Argo CD, where the existing secret can't be looked up and would get a new value on every render
  createSecret: true

  # The host that the Review App Action sends deploys to, like review-app-webhooks.example.com,
  # which the Ingress and the HTTPRoute route to the webhook. Earlier charts set it in ingress.host
  host: ""

  ingress:
    enabled: true
    ingressClassName: ""
    annotations: {}
    # Enable cert-manager
    # cert-manager.io/cluster-issuer: letsencrypt
    # tls: true
    tls: false

  # An HTTPRoute of the Gateway API, instead of or next to the Ingress
  httpRoute:
    enabled: false
    # The Gateways to attach the HTTPRoute to, whose listeners terminate TLS
    # - name: gateway
    #   namespace: gateway-system
    #   sectionName: https
    parentRefs: []
    annotations: {}

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi
forwarder:
  # More than one replica keeps review apps reachable while a node is drained
  replicas: 2

  # How long a stopping forwarder waits for the requests in flight to finish
  terminationGracePeriodSeconds: 30

  # The hosts of the review apps, which the Ingress and the HTTPRoute route to the forwarder. They
  # MUST BE wildcards, like "*.review-apps.example.com", because one Ingress or HTTPRoute routes
  # the requests of every review app. Use them in the hostTemplates of the ReviewAppConfigs.
  # Earlier charts set them in ingress.hosts
  hosts: []

  ingress:
    enabled: true
    ingressClassName: ""
    annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    tls: false

  # An HTTPRoute of the Gateway API, instead of or next to the Ingress
  httpRoute:
    enabled: false
    # The Gateways to attach the HTTPRoute to, whose listeners terminate TLS for the hosts
    # - name: gateway
    #   namespace: gateway-system
    #   sectionName: https
    parentRefs: []
    annotations: {}
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

controllerManager:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 32Mi

serviceAccount:
  annotations: {}

kubernetesClusterDomain: cluster.local
