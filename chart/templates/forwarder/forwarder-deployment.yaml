apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-forwarder
  labels:
    control-plane: forwarder
  {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.forwarder.replicas }}
  selector:
    matchLabels:
      control-plane: forwarder
    {{- include "chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        control-plane: forwarder
      {{- include "chart.selectorLabels" . | nindent 8 }}
    spec:
      containers:
      - args:
        - --forwarder
        - --namespaces={{ join "," .Values.namespaces }}
        - --connection-timeout={{ .Values.connectionTimeout }}
        - --health-probe-bind-address=:8081
        # Finish the requests in flight within the grace period, after the preStop sleep
        - --graceful-shutdown-timeout={{ sub .Values.forwarder.terminationGracePeriodSeconds 10 }}s
        command:
        - /manager
        env:
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.image }}:{{ .Values.tag | default .Chart.AppVersion }}
        lifecycle:
          # Keep serving until the ingress no longer sends requests to the stopping pod
          preStop:
            sleep:
              seconds: 5
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 1
          periodSeconds: 5
        resources: {{- toYaml .Values.forwarder.resources | nindent 10
          }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      securityContext:
        runAsNonRoot: true
      serviceAccountName: {{ include "chart.fullname" . }}-forwarder
      terminationGracePeriodSeconds: {{ .Values.forwarder.terminationGracePeriodSeconds }}
      # Spread the replicas over nodes and zones, so that losing one doesn't take them all
      topologySpreadConstraints:
      {{- range list "kubernetes.io/hostname" "topology.kubernetes.io/zone" }}
      - maxSkew: 1
        topologyKey: {{ . }}
        whenUnsatisfiable: ScheduleAnyway
        matchLabelKeys:
        - pod-template-hash
        labelSelector:
          matchLabels:
            control-plane: forwarder
          {{- include "chart.selectorLabels" $ | nindent 12 }}
      {{- end }}